        cwd: "."
        startup:
          actions:
            - type: send_text
              value: "exec ./bin/seat pi.sdc"
              phase: after_ready
              idempotent: true
    edges:
      - kind: delegates_to
        from: lead
        to: synth
      - kind: delegates_to
        from: lead
        to: lec
      - kind: delegates_to
        from: lead
        to: power
      - kind: delegates_to
        from: lead
        to: sta
      - kind: delegates_to
        from: lead
        to: sdc
  - id: infra
    label: Infra
    summary: 파이프라인 API 서버(Seat sandbox 밖의 유일한 IR/RTL 쓰기 주체)와 게이트웨이
    members:
      - id: pipeline
        label: "Pipeline API"
        agent_ref: "builtin:terminal"
        profile: none
        runtime: terminal
        cwd: "."
        startup:
          actions:
            - type: send_text
              value: "exec ./bin/pipeline-server"
              phase: after_ready
              idempotent: true
      - id: gateway
        label: "Gateway"
        agent_ref: "builtin:terminal"
        profile: none
        runtime: terminal
        cwd: "."
        startup:
          actions:
            - type: send_text
              value: "exec ./bin/gateway-server"
              phase: after_ready
              idempotent: true
    edges: []
edges:
  - kind: delegates_to
    from: lead.chip
    to: design.lead
  - kind: delegates_to
    from: lead.chip
    to: dv.lead
  - kind: delegates_to
    from: lead.chip
    to: pi.lead
  - kind: escalates_to
    from: dv.lead
    to: design.lead
  - kind: escalates_to
    from: pi.lead
    to: design.lead
  - kind: escalates_to
    from: design.lead
    to: lead.chip
